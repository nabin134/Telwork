<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Wink Me Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=3" />
  <link rel="icon" href="assets/logo.png" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container"><h1>Contact us</h1><p>We usually reply within a few hours.</p></div>
    </section>
    <section class="section">
      <div class="container prose" style="margin-inline:auto;text-align:center">
        <p>The fastest way to reach us is on Telegram — our support team is there every day.</p>
        <a class="btn btn-gradient btn-lg tg-link" href="#telegram">Join on Telegram</a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js?v=3"></script>
  <script src="js/site.js?v=3"></script>
  <script>WinkSite.init("contact"); document.querySelectorAll(".tg-link").forEach(a => a.setAttribute("href", WinkSite.telegramHref()));</script>
</body>
</html>
